# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install font
      run: |
        export FONTPATH=/usr/share/fonts/truetype/jetbrainsmono
        mkdir -p $FONTPATH
        cp Resources/font/jetbrainsmono/*.ttf $FONTPATH
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: clock
        path: out.bmp
        if-no-files-found: error
        
  comment:    
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:  
      pull-requests: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: clock
          path: .
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Upload image
        id: encode
        run: |          
          DATE=$(date +'%Y-%m-%d')          
          FILENAME="clockface-$DATE-$GITHUB_SHA.png"
          convert out.bmp $FILENAME
          aws s3 cp $FILENAME "s3://rpiclock-artifacts/$FILENAME" 
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV          
      - name: Comment
        uses: actions/github-script@v7
        with:
          script: |            
            const filename = process.env.FILENAME;
            const body = `### 📷 Clock face for this build:\n\n ![Clockface](https://rpiclock-artifacts.s3.amazonaws.com/${filename})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })
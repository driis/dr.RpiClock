# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Install font
      run: |
        export FONTPATH=/usr/share/fonts/truetype/jetbrainsmono
        mkdir -p $FONTPATH
        cp Resources/font/jetbrainsmono/*.ttf $FONTPATH
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: clock
        path: out.bmp
        if-no-files-found: error
        
  comment:    
    needs: build
    runs-on: ubuntu-latest
    permissions:  
      pull-requests: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: clock
          path: download
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Generate Base64 Image
        id: encode
        run: |
          file=$(ls download)
          png_file="converted.png"
          convert "download/$file" "$png_file"
          mime_type=$(file --mime-type -b "$png_file")
          echo -n "data:${mime_type};base64," > image.txt
          base64 -w 0 "$png_file" >> image.txt
      - name: Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const imageData = fs.readFileSync('image.txt', 'utf8');
            console.log("Image data length", imageData.length);                      
            const body = `### 📷 Clock face for this build \n\n<img src="${imageData}" width="800"/>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })